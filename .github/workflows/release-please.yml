# Open and maintain the release pull request with the fleet release bot.
#
# A Conventional Commit landing on main makes the bot open or update
# "chore(main): release X.Y.Z"; merging that pull request writes version.txt,
# the three workspace package.json versions, the CHANGELOG.md entry, tags
# vX.Y.Z and publishes the GitHub Release.
#
# The release must be created by the misoto22-release-bot App token rather than
# GITHUB_TOKEN: anything created with GITHUB_TOKEN triggers no further workflow
# runs, so an `on: release: published` consumer would silently never fire.
#
# release-type is `simple` because this is one product in three workspace
# packages and the root package.json is a private script launcher with no
# version of its own. version.txt is the single version; the three packages
# follow it through extra-files.
#
# The iOS app is a second component (apps/ios): its own version, CHANGELOG and
# `ios-vX.Y.Z` tag, written into apps/ios/Config/Version.xcconfig. It stays 0.x
# (bump-minor-pre-major) until the App Store launch, when a `Release-As: 1.0.0`
# footer takes it to 1.0.0. The root package excludes apps/ios, so iOS-only
# commits do not bump the web and worker version.
#
# GitHub marks the newest release Latest, and release-please has no way to opt
# a component out (it never sends `make_latest`). The keep-app-latest job points
# Latest back at the newest web and worker `vX.Y.Z` after any release, so an
# `ios-vX.Y.Z` never holds it.
#
# This repository has never been tagged, so release-please-config.json carries a
# bootstrap-sha pinned to the main HEAD this workflow was added at. Commits
# before it are not considered.

name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    uses: Misoto22/ci/.github/workflows/release.yml@65443cf5cd7c65b978373aeb0a0e93127b0d6ede # v0.5.0
    with:
      app-client-id: ${{ vars.APP_CLIENT_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  keep-app-latest:
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mark the newest vX.Y.Z release as Latest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          found=$(gh api "repos/$REPO/releases?per_page=100" --jq '
            [.[] | select(.draft == false and .prerelease == false
                          and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))]
            | sort_by(.created_at) | last // empty | "\(.id) \(.tag_name)"')
          if [ -z "$found" ]; then
            echo "No vX.Y.Z release yet; nothing to mark."
            exit 0
          fi
          read -r id tag <<<"$found"
          gh api -X PATCH "repos/$REPO/releases/$id" -f make_latest=true --jq '.tag_name' >/dev/null
          latest=$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')
          if [ "$latest" != "$tag" ]; then
            echo "::error::Latest is $latest, expected $tag"
            exit 1
          fi
          echo "Latest is $tag"
