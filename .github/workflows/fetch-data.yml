name: Fetch Fuel Data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: # 手动触发

concurrency:
  group: fetch-data
  cancel-in-progress: false # queue overlapping runs; never interrupt a write mid-flight

jobs:
  fetch:
    name: Fetch & Write to KV
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @servo-map/shared build
      - name: Fetch data and write to KV
        run: npx tsx scripts/fetch-data.ts
        env:
          NSW_API_KEY: ${{ secrets.NSW_API_KEY }}
          NSW_API_AUTH: ${{ secrets.NSW_API_AUTH }}
          QLD_API_TOKEN: ${{ secrets.QLD_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_KV_NAMESPACE_ID: "7bb3949a4e20480fbde7fefeadd1fe41"
          # Decision 0006: price history in D1; the step skips D1 when this is unset.
          D1_PRICES_DATABASE_ID: ${{ vars.D1_PRICES_DATABASE_ID }}
      - name: Send personal alerts
        # Decision 0004. Skips itself until the D1 database and APNs key are configured.
        run: npx tsx scripts/send-alerts.ts
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_KV_NAMESPACE_ID: "7bb3949a4e20480fbde7fefeadd1fe41"
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          APNS_KEY: ${{ secrets.APNS_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: BZVKP6884D
          APNS_TOPIC: com.misoto22.servomap
