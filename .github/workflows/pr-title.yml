# Lint the pull-request title against Conventional Commits.
#
# This repository squash-merges, so the pull-request title becomes the commit
# subject on main, and that subject is what release-please parses to decide the
# next version. A sloppy title is a missed release or a wrong bump.
#
# The trigger is pull_request_target because a pull_request run from a fork gets
# a read-only token, and this repository is public so fork pull requests are a
# real case. That trigger is safe here only because the called workflow checks
# out nothing: it reads the pull-request title through the API and runs no code
# from the head branch, so an attacker's fork never executes with the elevated
# token.
#
# The caller job id is `pr-title` and the called job is also named `pr-title`,
# so the status-check context is `pr-title / pr-title`.

name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    uses: Misoto22/ci/.github/workflows/pr-title.yml@15e181fe060c385c48746de832f675f5c21c07b0 # v0.7.1
