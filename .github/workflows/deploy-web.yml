name: Deploy Web

# The only path to production. Vercel's Git integration is switched off in packages/web/vercel.json:
# it deployed every branch push and every main push, which spent the Hobby plan's 100 deployments a
# day on previews nobody could open without signing in, and raced this job on main.
on:
  push:
    branches: [main]
    paths:
      - packages/web/**
      - packages/shared/**
      - packages/design-tokens/**
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy to Vercel
        run: >
          npx vercel deploy --prod
          --build-env NEXT_PUBLIC_MAPBOX_TOKEN=${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
          --build-env NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
