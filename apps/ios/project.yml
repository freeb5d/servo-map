# Generate the Xcode project with `xcodegen generate` (the .xcodeproj is not committed).
name: ServoMap
options:
  bundleIdPrefix: com.misoto22
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
# MARKETING_VERSION is not in `settings`: release-please owns it in Config/Version.xcconfig, and a
# value here would be written into the generated configuration and override the xcconfig.
# CURRENT_PROJECT_VERSION is the build number; fastlane sets it per upload from TestFlight.
configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: BZVKP6884D
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: ServoMap
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "ServoMap uses your location to list fuel prices near you. It is not stored or shared."
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    # Portrait-only apps must opt out of iPad multitasking, or App Store Connect rejects the upload.
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    # Only HTTPS to the ServoMap API, which is exempt; answers the export question per upload.
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    # Google sign-in's iOS OAuth client id (decision 0004); empty hides the Google button.
    GOOGLE_IOS_CLIENT_ID: ""
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ServoMap:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: Widgets/PriceWidgetViews.swift
      # The app icon: an Icon Composer bundle generated by design/app-icon/generate.py.
      - path: ../../design/app-icon/ServoMap.icon
        type: file
        buildPhase: resources
      # Generated from the TypeScript sources of truth; never edit or copy them here.
      - path: ../../packages/design-tokens/generated/swift/ServoMapTokens.swift
      - path: ../../packages/shared/generated/swift/ServoMapBrands.swift
      - path: ../../packages/shared/generated/swift/ServoMapDataSources.swift
    # Push for price alerts. Release builds (TestFlight, App Store) use the production APNs gateway.
    entitlements:
      path: Config/ServoMap.entitlements
      properties:
        aps-environment: production
        com.apple.developer.applesignin: [Default]
    dependencies:
      - target: ServoMapWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.misoto22.servomap
        INFOPLIST_KEY_ServoMapGoogleClientID: $(GOOGLE_IOS_CLIENT_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: ServoMap
  ServoMapWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      # The widget reuses the app's model, API and components rather than copying them.
      - path: Sources/Model.swift
      - path: Sources/API.swift
      - path: Sources/PlaceNames.swift
      - path: Sources/Trend.swift
      - path: Sources/Components.swift
      - path: Sources/Store.swift
      - path: Sources/FuelType+AppEnum.swift
      - path: Resources/Fonts
      # Brand logos, so widgets show the same marks as the app.
      - path: Resources/Assets.xcassets
      - path: ../../packages/design-tokens/generated/swift/ServoMapTokens.swift
      - path: ../../packages/shared/generated/swift/ServoMapBrands.swift
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: ServoMap
        # An extension must carry its app's version and build, or App Store Connect rejects the upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - ShipporiMincho-Medium.ttf
          - ShipporiMincho-SemiBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.misoto22.servomap.widgets
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  ServoMapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ServoMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.misoto22.servomap.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ServoMap:
    build:
      targets:
        ServoMap: all
    test:
      targets:
        - ServoMapTests
